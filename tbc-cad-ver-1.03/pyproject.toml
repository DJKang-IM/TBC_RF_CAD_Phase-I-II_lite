[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tbc-cad-ver-1-03"
version = "1.0.3"
description = "TBC-CAD 1.03 D1-D6"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pydicom>=2.4",
  "torch>=2.0",
  "torchvision>=0.15",
  "scikit-learn>=1.3",
  "joblib>=1.3",
  "tqdm>=4.65",
  "xgboost>=2.0",
  "certifi>=2023.0",
]

[project.scripts]
tbc-cad-infer-103 = "tbc_cad_ver_103.cli:main"

[tool.setuptools.packages.find]
where = ["src"]